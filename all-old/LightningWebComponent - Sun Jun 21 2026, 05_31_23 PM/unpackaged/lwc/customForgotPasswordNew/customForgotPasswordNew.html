<template>
    <div class="banner" style={backgroundStyle}>
        <div class="portal-background">
            <div class="admission-card">

                <div class="admission-header">
                    <div class="header-inline">
                        <span class="title-gradient">Password Reset</span>
                    </div>
                </div>

                <p style="font-size: 0.9rem; color: #444; margin-bottom: 8px;">
                    To reset your password, we'll need your username.
                    Username format will be 26415000241@reva.edu.in.
                </p>
                <p style="font-size: 0.9rem; color: #444; margin-bottom: 12px;">
                    We'll send password reset instructions to the email
                    address associated with your account.
                </p>

                <div class="form-row">
                    <lightning-input
                        type="text"
                        label="Username"
                        placeholder="Eg.: 26415000241@reva.edu.in"
                        variant="label-hidden"
                        name="resetUsername"
                        value={username}
                        onchange={handleUsernameChange}
                        required>
                    </lightning-input>
                </div>

                <template if:true={errorMessage}>
                    <div class="field-error">{errorMessage}</div>
                </template>

                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_medium">
                    <div style="display:block!important;width:100%;">
                        <lightning-button variant="destructive" label="Reset Password" onclick={handleReset}></lightning-button>
                    </div>
                </div>

            </div>
        </div>
    </div>
</template>
