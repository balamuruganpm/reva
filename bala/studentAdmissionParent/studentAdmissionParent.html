<template>

                        <h1 class="font-78">
                            <span class="clr-red">CAMPUS</span>
                            <span class="fw-light"> TO</span> <br />
                            CAPABILITY
                        </h1>
                        <p class="mt-3 font-39">
                            Admissions Closing Soon for <br /> 2026–27
                        </p>
                        <button class="btn apply-btn mt-lg-4" onclick={scrollToForm}>
                            APPLY NOW
                        </button>
                    </div>
                </div>

                <!-- Right Form Section -->
                <div class="form-column auth-card" id="form-container">
                    <template if:true={isRegistrationForm}>
                        <c-student-admission-single-page-new></c-student-admission-single-page-new>
                    </template>
                    <template if:true={isLoginForm}>
                        <c-student-admission-login-page></c-student-admission-login-page>
                    </template>
                    <template if:true={isOtpForm}>
                        <c-student-admission-o-t-p-login></c-student-admission-o-t-p-login>
                    </template>
                    <template if:true={isForgotForm}>
                        <c-custom-forgot-password-new></c-custom-forgot-password-new>
                    </template>
                </div>
            </div>
        </div>
