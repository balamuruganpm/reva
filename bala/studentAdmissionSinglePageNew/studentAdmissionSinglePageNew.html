                    </div>
                </template>

                <div class="card-body">
                    <div class="admission-header">
                    <div class="header-inline">
                        <span class="title-gradient">Admissions {propYear}</span>
                        <lightning-icon icon-name="utility:education" size="medium"
                            class="education-icon"></lightning-icon>
                    </div>
                </div>

                    <div class="two-col two-col-new">
